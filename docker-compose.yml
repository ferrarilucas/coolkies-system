services:
  db:
    image: postgres:16-alpine
    container_name: cookies_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cookies
      POSTGRES_PASSWORD: cookies
      POSTGRES_DB: cookies
    ports:
      - "5432:5432"
    volumes:
      - cookies_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cookies -d cookies"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cookies_pgdata:
